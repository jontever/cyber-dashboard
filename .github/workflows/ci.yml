name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["public/data/**", "data/cache/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate config YAML
        run: node -e "const y=require('js-yaml'),fs=require('fs');for(const f of fs.readdirSync('config'))y.load(fs.readFileSync('config/'+f,'utf8'));console.log('config ok')"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
