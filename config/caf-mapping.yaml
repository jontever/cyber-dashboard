# Starter mapping from ATT&CK tactics and D3FEND defensive tactics to
# NCSC Cyber Assessment Framework (CAF) contributing outcomes.
#
# This is an opinionated, reviewable heuristic, not an official NCSC mapping.
# Verify outcome codes and wording against the CAF v4.0 text before relying
# on it, and open a pull request to improve it.

outcomes:
  A3.a: Asset management
  B2.a: Identity verification, authentication and authorisation
  B2.c: Privileged user management
  B3.b: Data in transit
  B3.c: Stored data
  B4.a: Secure by design
  B4.b: Secure configuration
  B4.c: Secure management
  B4.d: Vulnerability management
  B5.b: Design for resilience
  B5.c: Backups
  C1.a: Monitoring coverage
  C2.a: System abnormalities for attack detection
  C2.b: Proactive attack discovery
  D1.b: Response and recovery capability

# Every entry in the KEV catalogue is, by definition, a known exploited
# vulnerability, so it always maps here.
always: [B4.d]

# ATT&CK tactic shortname -> CAF outcomes. Includes current and legacy
# shortnames (ATT&CK v18+ splits defense-evasion into stealth and
# defense-impairment).
attack_tactics:
  reconnaissance: [A3.a]
  resource-development: []
  initial-access: [B4.b, B4.a]
  execution: [B4.b, C2.a]
  persistence: [B4.c, C2.a]
  privilege-escalation: [B2.c, B4.b]
  credential-access: [B2.a, B2.c]
  defense-evasion: [C1.a, C2.a]
  stealth: [C1.a, C2.a]
  defense-impairment: [B4.c, C1.a]
  discovery: [C2.b]
  lateral-movement: [B5.b, B2.a]
  collection: [B3.c]
  command-and-control: [C1.a, B4.b]
  exfiltration: [B3.b, C1.a]
  impact: [B5.c, D1.b]

# D3FEND defensive tactic -> CAF outcomes.
d3fend_tactics:
  Model: [A3.a]
  Harden: [B4.b]
  Detect: [C1.a, C2.a]
  Isolate: [B5.b, B4.b]
  Deceive: [C2.b]
  Evict: [D1.b]
  Restore: [B5.c, D1.b]
